<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#eef2e8"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'"><title>Boring Chat — English Practice</title><link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjQ0IiBmaWxsPSIjZGRlN2Q1Ii8+PHBhdGggZD0iTTQ1IDY1TDQwIDM1IDc2IDUyUTk2IDQzIDExNiA1MkwxNTIgMzUgMTQ3IDY1UTE2NSAxNDYgOTYgMTU5UTI3IDE0NiA0NSA2NSIgZmlsbD0iIzZkODU2MiIvPjxjaXJjbGUgY3g9IjczIiBjeT0iODUiIHI9IjI2IiBmaWxsPSIjZmFmOGU4Ii8+PGNpcmNsZSBjeD0iMTE5IiBjeT0iODUiIHI9IjI2IiBmaWxsPSIjZmFmOGU4Ii8+PGNpcmNsZSBjeD0iNzMiIGN5PSI4NSIgcj0iOSIgZmlsbD0iIzI5M2UzNSIvPjxjaXJjbGUgY3g9IjExOSIgY3k9Ijg1IiByPSI5IiBmaWxsPSIjMjkzZTM1Ii8+PHBhdGggZD0iTTg2IDEwOEw5NiAxMjQgMTA2IDEwOCIgZmlsbD0iI2QwYTg2NyIvPjwvc3ZnPgo="><style>:root{color-scheme:light;--bg:#eef2e8;--paper:#fafbf5;--ink:#293e35;--muted:#6c7c63;--line:#d7dfd2;--button:#3d5c46;--soft:#e4eedc;--mine:#dce9d2;--owl-bg:#dde7d5}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px}main{max-width:760px;margin:auto;background:var(--paper);padding:28px;border:1px solid var(--line);border-radius:28px;min-height:calc(100dvh - 48px);display:flex;flex-direction:column}header{display:flex;gap:14px;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line)}.identity{min-width:0;flex:1}.brand{font-size:10px;letter-spacing:2.5px;font-weight:700}h1{font-size:25px;line-height:1.2;margin:4px 0}header p{font-size:12px;color:var(--muted);margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;background:var(--soft);color:var(--ink);min-height:44px}button:hover{filter:brightness(.96)}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid #92aa7f;outline-offset:3px}header button{font-size:24px;padding:4px;background:transparent;min-width:32px;display:grid;place-items:center;flex-shrink:0}.intro{padding:22px 0 16px}.intro>span{font-size:10px;letter-spacing:2px;color:var(--muted)}h2{font-size:34px;line-height:1.08;font-weight:500;margin:10px 0}.intro p{font-size:13px;color:var(--muted);margin:10px 0 0}nav{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:14px}nav button{font-size:12px;border:1px solid var(--line)}#messages{display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:200px;max-height:52dvh;padding:12px 2px;scrollbar-width:thin;flex:1}.bubble{align-self:flex-start;max-width:92%;padding:13px 15px;border:1px solid var(--line);border-radius:16px 16px 16px 4px;background:var(--bg);overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:var(--mine);border-radius:16px 16px 4px 16px}.label{display:block;font-size:9px;font-weight:700;letter-spacing:1.6px;color:var(--muted);margin-bottom:7px}.text{white-space:pre-wrap;font-size:14px;line-height:1.55}.practice-choices{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.practice-choices button{border:1px solid var(--line);font-size:14px}#status{min-height:20px;font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin:10px 0}form{display:flex;gap:10px}input{border:1px solid var(--line);border-radius:14px;padding:14px 12px;background:var(--paper);color:var(--ink);min-width:0;flex:1;font-size:16px}form>button{background:var(--button);color:#fff;min-width:48px;font-size:21px;padding:8px}footer{text-align:center;font-size:11px;color:var(--muted);padding-top:16px}.dark{color-scheme:dark;--bg:#101713;--paper:#18231b;--ink:#e2ecd9;--muted:#b5c3a9;--line:#354b38;--button:#547958;--soft:#293f2e;--mine:#2a4130;--owl-bg:#293c2d}
.owl{width:70px;height:70px;background:var(--owl-bg);border-radius:24px;position:relative;overflow:hidden;flex-shrink:0}.owl-body{position:absolute;left:21%;top:25%;width:58%;height:58%;background:#b88d68;border-radius:38% 38% 48% 48% / 34% 34% 66% 66%}.owl-body::before,.owl-body::after{content:'';position:absolute;top:-23%;width:36%;height:44%;background:#b88d68;clip-path:polygon(0 0,100% 55%,12% 100%)}.owl-body::before{left:0;transform:rotate(-5deg)}.owl-body::after{right:0;transform:scaleX(-1) rotate(-5deg)}.owl-eye{position:absolute;z-index:1;top:1%;width:46%;height:46%;background:#fff2dc;border-radius:50%}.owl-eye-left{left:6%}.owl-eye-right{right:6%}.owl-eye::before{content:'';position:absolute;width:35%;height:35%;left:32.5%;top:32.5%;background:#61442f;border-radius:50%}.owl-beak{position:absolute;z-index:2;left:41%;top:47%;width:18%;height:16%;background:#dba35f;clip-path:polygon(0 0,100% 0,50% 100%)}
@media(max-width:500px){body{padding:0}main{padding:18px 14px;border:0;border-radius:0;min-height:100dvh}header{gap:8px;padding-bottom:16px}.owl{width:46px;height:46px;border-radius:15px}h1{font-size:20px}.brand{font-size:9px;letter-spacing:1.7px}header p{font-size:10px}h2{font-size:28px}.intro{padding:16px 0}header button{min-width:30px}nav{gap:6px}nav button{padding:9px 10px}#messages{max-height:48dvh}.bubble{max-width:95%}}@media(max-height:600px){.intro{display:none}nav{padding-top:12px}#messages{max-height:48dvh;min-height:100px}}

/* A standalone <3 becomes a beating heart, with a quiet accessibility fallback. */
.message-heart{display:block;width:1.4em;margin:10px 8px;color:#e63956;font-size:64px;line-height:1.25;text-align:center;transform-origin:center;animation:message-heartbeat 1.2s ease-in-out infinite}
@keyframes message-heartbeat{0%,40%,100%{transform:scale(1)}12%{transform:scale(1.18)}24%{transform:scale(1)}32%{transform:scale(1.1)}}
@media(prefers-reduced-motion:reduce){.message-heart{animation:none}}
</style></head><body><main><header><div class="owl" role="img" aria-label="Coruja"><span class="owl-body" aria-hidden="true"><span class="owl-eye owl-eye-left"></span><span class="owl-eye owl-eye-right"></span><span class="owl-beak"></span></span></div><div class="identity"><span class="brand">BORING CHAT</span><h1>English Practice</h1><p>A little practice. Every day.</p></div><button id="share-practice" type="button" aria-label="Compartilhar Boring Chat" title="Compartilhar Boring Chat"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="5" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m7.7 10.5 7.6-4M7.7 13.5l7.6 4"/></svg></button><button id="theme-toggle" type="button" aria-label="Mudar tema"></button></header><section class="intro"><span>YOUR DAILY FIVE MINUTES</span><h2>Small talk.<br>Little progress.</h2><p>Aprenda inglês com exercícios e jogos rápidos.</p></section><nav id="topics"><button data-topic="hello">Hello & goodbye</button><button data-topic="name">Meet someone</button><button data-topic="possessives">Possessives</button><button data-topic="be">To be game</button></nav><section id="messages" aria-label="Conversa com o tutor" aria-live="polite"></section><p id="status" role="status"></p><form id="compose"><input id="input" autocomplete="off" placeholder="Write something in English…" aria-label="Sua resposta" maxlength="4000"><button type="submit" aria-label="Enviar">➤</button></form><footer>A quiet place to practice.</footer></main><script>'use strict';
const API_BASE='';
const messages=document.querySelector('#messages'),input=document.querySelector('#input'),status=document.querySelector('#status');
let state=null,busy=false;
function renderMessageHeart(body,text){
  const heart=typeof text==='string'&&text.trim()==='<3';
  body.classList.toggle('message-heart',heart);
  if(heart){body.textContent='♥';body.setAttribute('role','img');body.setAttribute('aria-label','Coração pulsante');}
  else{body.textContent=text;body.removeAttribute('role');body.removeAttribute('aria-label');}
}
function bubble(text,mine=false){const el=document.createElement('article');el.className='bubble'+(mine?' mine':'');const label=document.createElement('span');label.className='label';label.textContent=mine?'YOU':'ENGLISH TUTOR';const body=document.createElement('div');body.className='text';renderMessageHeart(body,text);el.append(label,body);messages.append(el);return el;}
function show(result){document.querySelector('.practice-choices')?.remove();bubble(result.text);if(result.choices?.length){const choices=document.createElement('div');choices.className='practice-choices';choices.setAttribute('role','group');choices.setAttribute('aria-label','Escolha uma resposta');for(const text of result.choices){const button=document.createElement('button');button.type='button';button.textContent=text;button.onclick=()=>send(text);choices.append(button);}messages.append(choices);}messages.scrollTop=messages.scrollHeight;}
function setBusy(value){busy=value;document.querySelectorAll('#compose button,#topics button,.practice-choices button').forEach(b=>b.disabled=value);status.textContent=value?'O tutor está pensando…':'';}
async function ask(data){if(busy)return;setBusy(true);const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(API_BASE+'/api/tutor/message',{method:'POST',mode:'same-origin',credentials:'omit',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:controller.signal});const result=await response.json();if(!response.ok)throw Error(result.error||'O tutor está indisponível.');state=result.state||null;show(result);setBusy(false);}catch(error){setBusy(false);status.textContent=error.name==='AbortError'?'O tutor demorou para responder. Tente novamente.':error instanceof TypeError?'Não foi possível falar com o tutor. Tente novamente em instantes.':error.message;}finally{clearTimeout(timer);}}
function send(text){if(busy)return;bubble(text,true);ask({message:text,state});}
document.querySelector('#compose').onsubmit=event=>{event.preventDefault();const text=input.value.trim();if(!text||busy)return;input.value='';send(text);};
document.querySelectorAll('[data-topic]').forEach(button=>button.onclick=()=>ask({topic:button.dataset.topic}));
const toggle=document.querySelector('#theme-toggle');
function theme(dark){document.documentElement.classList.toggle('dark',dark);toggle.innerHTML=dark?'<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>':'<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>';toggle.setAttribute('aria-label',dark?'Ativar modo claro':'Ativar modo escuro');toggle.setAttribute('aria-pressed',String(dark));}
let saved;try{saved=localStorage.getItem('boring-public-theme');}catch(e){}
theme(saved?saved==='dark':matchMedia('(prefers-color-scheme: dark)').matches);
toggle.onclick=()=>{const dark=!document.documentElement.classList.contains('dark');theme(dark);try{localStorage.setItem('boring-public-theme',dark?'dark':'light');}catch(e){}};
document.querySelector('#share-practice').onclick=async()=>{const url=location.href.split(/[?#]/)[0];try{if(navigator.share){await navigator.share({title:'Boring Chat — English Practice',url});return;}await navigator.clipboard.writeText(url);status.textContent='Link do Boring Chat copiado.';}catch(error){if(error.name!=='AbortError')status.textContent='Link para compartilhar: '+url;}};
bubble('Hello! I’m your English practice partner.\nPratique um pouco todos os dias. Escolha uma atividade para começar.');
</script></body></html>
